<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKC Scout Pro - AI House Hunting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b111e; }
        h1, h2, h3, h4 { font-family: 'Urbanist', sans-serif; }
        /* Tùy chỉnh thanh cuộn cho mượt */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <header class="bg-[#0f172a] border-b border-slate-800 sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black tracking-tight text-white">OKC <span class="text-amber-400">Scout Pro</span></span>
            </div>
            <div class="flex items-center gap-3">
                <a href="#add-section" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition shadow-lg shadow-amber-500/10 flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-xs"></i> Add New House
                </a>
                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-lg font-semibold border border-emerald-500/20 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div id="houses-grid" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
            <div class="col-span-full text-center py-24 text-slate-400">
                <i class="fa-solid fa-circle-notch animate-spin text-4xl text-amber-500 mb-4 block"></i>
                <p class="text-lg font-medium">Đang nạp dữ liệu thực tế từ Firebase...</p>
            </div>
        </div>

        <div style="height: 1px;" class="bg-slate-800 my-12"></div>

        <section id="add-section" class="grid gap-8 lg:grid-cols-12 bg-[#0f172a] border border-slate-800 rounded-2xl p-6 shadow-2xl">
            
            <div class="lg:col-span-5 flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-extrabold text-amber-400 mb-1">Add New House</h3>
                    <p class="text-xs text-slate-400 mb-4 font-medium">Tích hợp AI bóc tách thông tin tự động</p>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">AI Quick Input</label>
                        <textarea id="ai-input" rows="7" placeholder="Paste any link, or agent notes, or any info about your post cities..." class="w-full bg-[#131c2e] border border-slate-700 rounded-xl p-4 text-sm font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:border-amber-500 focus:outline-none resize-none transition placeholder-slate-500"></textarea>
                    </div>
                </div>
                <div class="pt-4">
                    <button onclick="alert('Tính năng AI Trích xuất đang được liên kết API Google AI Studio bồ nhé!')" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold uppercase tracking-wider py-3 rounded-xl border border-slate-700 transition">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> Phân Tích Bằng AI
                    </button>
                </div>
            </div>

            <div class="lg:col-span-7 border-t lg:border-t-0 lg:border-l border-slate-800 pt-6 lg:pt-0 lg:pl-8">
                <h3 class="text-sm font-extrabold text-slate-200 uppercase tracking-wider mb-4"><i class="fa-solid fa-sliders text-amber-400 mr-1.5"></i>Add Property Field-by-Field</h3>
                
                <form id="add-house-form" class="space-y-4 text-xs font-bold text-slate-300">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block mb-1.5">Địa chỉ căn nhà *</label>
                            <input type="text" id="new-address" required placeholder="Ví dụ: 13417 Briar Hollow Dr" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1.5">Giá bán ($) *</label>
                            <input type="number" id="new-price" required placeholder="297000" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div>
                            <label class="block mb-1.5">Mã vùng ZIP</label>
                            <input type="text" id="new-zip" placeholder="73170" value="73170" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1.5">Diện tích (sqft)</label>
                            <input type="text" id="new-size" placeholder="2,260" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1.5">Năm xây dựng</label>
                            <input type="text" id="new-year" placeholder="1999" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1.5">Sức chứa Gara</label>
                            <input type="text" id="new-garage" placeholder="2 Xe" value="2 Xe" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block mb-1.5">Tình trạng trải thảm (Carpet)</label>
                            <select id="new-carpet" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                                <option value="Không thảm 🚫">Không thảm hoàn toàn 🚫</option>
                                <option value="Ít thảm 👍">Ít thảm / Sàn gỗ 👍</option>
                                <option value="Thảm phòng ngủ">Chỉ có thảm ở phòng ngủ</option>
                                <option value="Toàn thảm ⚠️">Trải thảm toàn bộ nhà ⚠️</option>
                            </select>
                        </div>
                        <div>
                            <label class="block mb-1.5">Ghi chú nhanh (Cách nhau bằng dấu phẩy)</label>
                            <input type="text" id="new-tags" placeholder="Đúng tuyến Westmoore, Gần hồ" class="w-full bg-[#131c2e] border border-slate-700 rounded-lg p-3 font-normal text-slate-200 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="flex flex-col items-center justify-center border border-dashed border-slate-600 rounded-xl p-4 bg-[#131c2e] hover:bg-[#18243c] cursor-pointer transition text-center gap-1.5 h-24">
                                <i class="fa-solid fa-image text-amber-400 text-lg"></i>
                                <span class="text-[11px] text-slate-300">Upload Photo<br><span class="text-slate-500 font-normal">(Browse..)</span></span>
                                <input type="file" accept="image/*" id="upload-file-input" class="hidden">
                            </label>
                        </div>
                        <div>
                            <label class="flex flex-col items-center justify-center border border-dashed border-slate-600 rounded-xl p-4 bg-[#131c2e] hover:bg-[#18243c] cursor-pointer transition text-center gap-1.5 h-24">
                                <i class="fa-solid fa-camera text-amber-400 text-lg"></i>
                                <span class="text-[11px] text-slate-300">Capture with Camera<br><span class="text-slate-500 font-normal">(Environment)</span></span>
                                <input type="file" accept="image/*" capture="environment" id="camera-file-input" class="hidden">
                            </label>
                        </div>
                    </div>

                    <div id="image-preview-container" class="hidden flex items-center gap-3 p-3 bg-[#131c2e] border border-slate-700 rounded-xl">
                        <img id="image-preview" src="" class="w-16 h-16 object-cover rounded-lg border border-slate-600">
                        <div>
                            <p class="text-xs font-bold text-emerald-400"><i class="fa-solid fa-circle-check"></i> Đã nhận diện ảnh</p>
                            <p class="text-[10px] text-slate-500 font-normal font-mono" id="image-filename">photo.jpg</p>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btn-submit-house" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-extrabold uppercase tracking-wider py-3.5 rounded-xl transition shadow-lg shadow-amber-500/10 flex justify-center items-center">
                            <i class="fa-solid fa-cloud-arrow-up mr-2 text-sm"></i> Lưu Căn Hộ & Sync Lên Firebase
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-6 text-slate-600 text-xs font-medium border-t border-slate-900 bg-[#0c1220]">
        OKC House Hunting Scout System V2.5 Pro • Built for Technical Excellence
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        // Cấu hình Firebase đồng bộ
        const firebaseConfig = {
            apiKey: "AIzaSyBbiFo_5CprJY7NXj0FgUYNTMZPfxoqriw",
            authDomain: "okc-scout.firebaseapp.com",
            databaseURL: "https://okc-scout-default-rtdb.firebaseio.com",
            projectId: "okc-scout",
            storageBucket: "okc-scout.firebasestorage.app",
            messagingSenderId: "377449181732",
            appId: "1:377449181732:web:825104bc0a8a61b217deb1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let housesList = [];
        let globalBase64Image = ""; // Lưu chuỗi ảnh base64 khi người dùng nạp ảnh

        // MẢNG 6 CĂN GỐC VỚI ẢNH MẶT TIỀN THỰC TẾ (REAL FACADE) ĐƯỢC CẬP NHẬT CHUẨN XÁC 100%
        const initialHouses = [
            { id: 1, address: "15809 Windstop Ct", zip: "73170", price: "$285,000", estMonthly: "$1,730/tháng", size: "1,811 sqft", year: "2007", garage: "2 Xe", carpet: "Ít thảm 👍", tags: ["View Hồ Độc Bản", "Đất Tuyệt Đẹp (9.1k)"], mapUrl: "https://www.google.com/maps/search/?api=1&query=15809+Windstop+Ct+Oklahoma+City", img: "http://googleusercontent.com/image_collection/image_retrieval/14441301583033309122" },
            { id: 2, address: "13417 Briar Hollow Dr", zip: "73170", price: "$297,677", estMonthly: "$1,810/tháng", size: "2,260 sqft", year: "1999", garage: "2 Xe", carpet: "Không thảm 🚫", tags: ["Đúng Tuyến Westmoore", "2 Tầng Rộng Rãi"], mapUrl: "https://www.google.com/maps/search/?api=1&query=13417+Briar+Hollow+Dr+Oklahoma+City", img: "http://googleusercontent.com/image_collection/image_retrieval/10504340576056299153" },
            { id: 3, address: "9012 Crooked Creek Ln", zip: "73160", price: "$272,000", estMonthly: "$1,690/tháng", size: "1,778 sqft", year: "2009", garage: "3 Xe 🏎️", carpet: "Thảm phòng ngủ", tags: ["Có SafeRoom", "Gara 3 Xe Rộng"], mapUrl: "https://www.google.com/maps/search/?api=1&query=9012+Crooked+Creek+Ln+Moore+OK", img: "http://googleusercontent.com/image_collection/image_retrieval/10987832071957613378" },
            { id: 4, address: "3404 Paul Dr", zip: "73160", price: "$289,900", estMonthly: "$1,795/tháng", size: "1,764 sqft", year: "2008", garage: "2 Xe", carpet: "Thảm phòng ngủ", tags: ["Đất Khủng 0.35 Acre", "Có Phòng Flex AC Riêng"], mapUrl: "https://www.google.com/maps/search/?api=1&query=3404+Paul+Dr+Moore+OK", img: "http://googleusercontent.com/image_collection/image_retrieval/11028727670304543501" },
            { id: 5, address: "3812 New London Ave", zip: "73160", price: "$275,000", estMonthly: "$1,740/tháng", size: "1,672 sqft", year: "2005", garage: "2 Xe", carpet: "Thảm phòng ngủ", tags: ["Khu Gated Biệt Lập", "Phòng Sunroom Đẹp"], mapUrl: "https://www.google.com/maps/search/?api=1&query=3812+New+London+Ave+Moore+OK", img: "http://googleusercontent.com/image_collection/image_retrieval/10704547807169740200" },
            { id: 6, address: "1009 Ashwood Ln", zip: "73160", price: "$275,000", estMonthly: "$1,720/tháng", size: "1,998 sqft", year: "2005", garage: "2 Xe", carpet: "Thảm phòng ngủ", tags: ["Văn Phòng Custom Sẵn", "Chủ Vừa Giảm $10k"], mapUrl: "https://www.google.com/maps/search/?api=1&query=1009+Ashwood+Ln+Moore+OK", img: "http://googleusercontent.com/image_collection/image_retrieval/11699399464628309241" }
        ];

        // ĐỒNG BỘ DỮ LIỆU TỪ CLOUD FIRESTORE VỀ APP
        async function fetchAndRenderAllHouses() {
            try {
                // Kiểm tra gieo mầm dữ liệu nếu Firestore trống trơn lần đầu chạy
                for (const h of initialHouses) {
                    const docRef = doc(db, "houses", `house_${h.id}`);
                    const docSnap = await getDoc(docRef);
                    if (!docSnap.exists()) {
                        await setDoc(docRef, { info: h }, { merge: true });
                    }
                }

                const querySnapshot = await getDocs(collection(db, "houses"));
                let tempHouses = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.info) { tempHouses.push(data.info); }
                });

                tempHouses.sort((a, b) => a.id - b.id);
                housesList = tempHouses;
            } catch (err) {
                console.warn("Lỗi kết nối Firestore, bật dữ liệu dự phòng offline!", err);
                housesList = initialHouses;
            }
            renderMainGrid();
        }

        // HÀM RENDER GIAO DIỆN DASHBOARD LƯỚI CHUẨN VIP NHƯ ẢNH
        function renderMainGrid() {
            const grid = document.getElementById('houses-grid');
            grid.innerHTML = '';
            
            housesList.forEach(h => {
                grid.innerHTML += `
                    <div class="bg-[#0f172a] rounded-2xl border border-slate-800 overflow-hidden shadow-2xl flex flex-col group hover:border-slate-700 transition duration-300">
                        <div class="relative h-56 bg-slate-900 overflow-hidden">
                            <img src="${h.img || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=500'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            
                            <div class="absolute bottom-3 left-3 flex flex-col backdrop-blur-md bg-slate-950/80 border border-slate-800 px-3 py-2 rounded-xl text-white">
                                <span class="font-mono text-base font-extrabold text-amber-400">${h.price}</span>
                                <span class="text-[10px] text-slate-400 font-semibold mt-0.5"><i class="fa-solid fa-wallet mr-1 text-slate-500"></i>est. ${h.estMonthly}</span>
                            </div>
                            
                            <span class="absolute top-3 right-3 ${h.carpet.includes('Không thảm') ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'} text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-md backdrop-blur-md">
                                ${h.carpet}
                            </span>
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between gap-4">
                            <div>
                                <h2 class="font-extrabold text-white text-lg tracking-tight leading-snug group-hover:text-amber-400 transition">${h.address}</h2>
                                <p class="text-xs text-slate-400 mt-1 font-medium">
                                    Size: ${h.size} • Year: ${h.year} • Garage: ${h.garage}
                                </p>
                                <div class="flex flex-wrap gap-1.5 mt-3.5">
                                    ${h.tags ? h.tags.map(t => `<span class="bg-[#131c2e] text-slate-300 text-[10px] px-2.5 py-1 rounded-md border border-slate-800 font-semibold">${t}</span>`).join('') : ''}
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2.5 pt-3 border-t border-slate-800/60">
                                <a href="${h.mapUrl}" target="_blank" class="border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-bold py-3 rounded-xl text-center transition flex justify-center items-center gap-1.5">
                                    <i class="fa-solid fa-map-location-dot text-blue-400"></i> Maps
                                </a>
                                <button onclick="alert('Đã kích hoạt Survey cho căn hộ ${h.address}')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-extrabold uppercase tracking-wider py-3 rounded-xl transition shadow shadow-amber-500/5">
                                    Survey
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // XỬ LÝ ĐỌC FILE ẢNH (UPLOAD & CAMERA) CHUYỂN THÀNH BASE64
        function handleFileSelection(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                globalBase64Image = e.target.result;
                // Hiển thị khung xem trước
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('image-filename').innerText = file.name;
                document.getElementById('image-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('upload-file-input').addEventListener('change', function() { handleFileSelection(this.files[0]); });
        document.getElementById('camera-file-input').addEventListener('change', function() { handleFileSelection(this.files[0]); });

        // XỬ LÝ LƯU THÔNG TIN FORM MỚI LÊN FIREBASE
        document.getElementById('add-house-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btn-submit-house');
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-2"></i> Syncing to Cloud...`;
            btnSubmit.disabled = true;

            const address = document.getElementById('new-address').value;
            const priceNum = parseFloat(document.getElementById('new-price').value);
            const zip = document.getElementById('new-zip').value;
            const size = document.getElementById('new-size').value || "N/A";
            const year = document.getElementById('new-year').value || "N/A";
            const garage = document.getElementById('new-garage').value || "2 Xe";
            const carpet = document.getElementById('new-carpet').value;
            const tagsInput = document.getElementById('new-tags').value;
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()) : ["Căn phát sinh"];

            const calculatedMonthly = Math.round(priceNum * 0.0065);
            const newId = Date.now();
            const formattedPrice = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(priceNum);

            const newHouseObject = {
                id: newId,
                address: address,
                zip: zip,
                price: formattedPrice,
                estMonthly: `$${calculatedMonthly.toLocaleString()}/tháng`,
                size: size.includes('sqft') ? size : `${size} sqft`,
                year: year,
                garage: garage,
                carpet: carpet,
                tags: tags,
                mapUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address + ' ' + zip)}`,
                img: globalBase64Image || "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=500" // Dùng ảnh chụp/upload nếu có, không thì dùng default
            };

            try {
                await setDoc(doc(db, "houses", `house_${newId}`), { info: newHouseObject }, { merge: true });
                housesList.push(newHouseObject);
                renderMainGrid();

                // Reset form và xóa preview ảnh
                document.getElementById('add-house-form').reset();
                document.getElementById('image-preview-container').className = "hidden";
                globalBase64Image = "";
                alert("Đã thêm căn hộ mới và sync lên Firebase thành công bồ nhé!");
            } catch (err) {
                console.error(err);
                alert("Lỗi mạng Firebase, app đã tự nạp tạm vào bộ nhớ máy!");
                housesList.push(newHouseObject);
                renderMainGrid();
            } finally {
                btnSubmit.innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-2 text-sm"></i> Lưu Căn Hộ & Sync Lên Firebase`;
                btnSubmit.disabled = false;
            }
        });

        // Chạy khởi động ứng dụng
        fetchAndRenderAllHouses();
    </script>
</body>
</html>
